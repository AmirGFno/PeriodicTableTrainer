name: Build Windows Installer, Android APK, and Play Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip "pywebview[winforms]" pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows application (onedir, no Temp extraction)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "PeriodicTableTrainer" `
            --icon=app.ico `
            --add-data "windows_index.html;." `
            --collect-all webview --hidden-import=clr windows_app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          # Keep a replaceable external HTML copy beside the EXE; AppData HTML
          # from the updater takes precedence on the next launch.
          Copy-Item "windows_index.html" "dist/PeriodicTableTrainer/windows_index.html" -Force

      - name: Build Windows installer with Inno Setup
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force "dist/installer" | Out-Null
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $candidates = @((Join-Path $programFilesX86 'Inno Setup 6/ISCC.exe'), (Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe'))
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          & $iscc "/DMyAppVersion=$version" "installer/PeriodicTableTrainer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $setup = "dist/installer/PeriodicTableTrainer-Setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Setup executable was not created: $setup" }

      - name: Package Windows installer ZIP
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "dist/installer/PeriodicTableTrainer-Setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Setup executable is missing: $setup" }
          New-Item -ItemType Directory -Force "dist/windows-package" | Out-Null
          Copy-Item $setup "dist/windows-package/"
          Copy-Item "installer/Readme.txt" "dist/windows-package/Readme.txt"
          Compress-Archive -Path "dist/windows-package/*" -DestinationPath "dist/PeriodicTableTrainer-windows.zip" -Force

      - name: Upload Windows installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-zip
          path: dist/PeriodicTableTrainer-windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload replaceable Windows HTML
        uses: actions/upload-artifact@v4
        with:
          name: windows-html
          path: windows_index.html
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android APK and AAB (Capacitor 8 / API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install Dependencies and icon tooling
        run: |
          npm ci
          python3 -m pip install --disable-pip-version-check "Pillow>=10,<13"
          cp mobile_index.html www/index.html
          npx cap add android
          python3 capacitor/scripts/prepare_android.py
          npx cap sync android

      # In-place APK upgrades only work when every build carries the same
      # signing key; a freshly generated debug key produces
      # "App not installed as package conflicts with an existing package".
      - name: Detect optional persistent Android signing key
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] \
             && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Persistent signing key detected; APK/AAB will be signed for in-place updates."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets are incomplete; shipping a debug-signed APK. In-place APK updates will not work."
          fi

      - name: Report Android toolchain
        run: |
          java -version || true
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls -1 "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/nonexistent}}/build-tools" 2>/dev/null || true
          df -h / | tail -1

      # This exact build command has shipped successfully before; keep it as the
      # single path instead of branching into assembleRelease.
      - name: Build Android APK and Play Store App Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug bundleRelease

      # The previous failure happened inside this step, so it now inspects the
      # key first, reports every condition, and never aborts the job: an
      # installable APK must always reach the release.
      - name: Inspect the persistent signing key
        if: ${{ steps.android_signing.outputs.enabled == 'true' }}
        id: key_check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore" || true
          echo "keystore bytes: $(wc -c < "$keystore" 2>/dev/null || echo 0)"
          echo "--- keystore contents ---"
          if keytool -list -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1 | tail -20; then
            store_ok=true
          else
            store_ok=false
            echo "::warning::keytool could not open the keystore with ANDROID_KEYSTORE_PASSWORD (wrong password or not a JKS/PKCS12 file)."
          fi
          echo "--- alias details ---"
          keytool -list -v -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" 2>&1 | grep -E "Alias|Entry type|Valid|Certificate fingerprint|Owner" || true
          echo "--- alias check: $ANDROID_KEY_ALIAS ---"
          if keytool -list -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
               -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            alias_ok=true
          else
            alias_ok=false
            echo "::warning::alias $ANDROID_KEY_ALIAS was not found in the keystore; available entries are listed above."
          fi
          if [ "$store_ok" = true ] && [ "$alias_ok" = true ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falling back to the debug-signed APK; in-place updates will need a fixed key."
          fi

      - name: Sign APK and AAB with the persistent key
        if: ${{ steps.android_signing.outputs.enabled == 'true' && steps.key_check.outputs.usable == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android-output
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"

          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          build_tools=$(ls -1d "$sdk_root"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          echo "build-tools: $build_tools"

          # zipalign has to run before signing, otherwise the v2 signature breaks.
          "$build_tools/zipalign" -p -f 4 \
            android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/app-aligned.apk" \
            && echo "zipalign ok" || echo "::warning::zipalign failed"

          # ANDROID_KEY_PASSWORD is often stale while the keystore password is
          # correct; keytool still lists the entry, but signing needs the key
          # password to unlock the private key. Try the dedicated password
          # first and fall back to the keystore password, which is the default
          # when -keypass is omitted.
          sign_apk() {
            "$build_tools/apksigner" sign \
              --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$1" \
              --out android-output/app-debug.apk "$RUNNER_TEMP/app-aligned.apk" 2> "$RUNNER_TEMP/apksigner.err"
          }
          sign_aab() {
            jarsigner -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$1" \
              -signedjar "android-output/PeriodicTableTrainer-${GITHUB_RUN_NUMBER}.aab" \
              android/app/build/outputs/bundle/release/app-release.aab "$ANDROID_KEY_ALIAS" 2> "$RUNNER_TEMP/jarsigner.err"
          }

          apk_ok=false
          for candidate in "$ANDROID_KEY_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD"; do
            if sign_apk "$candidate"; then apk_ok=true; break; fi
            echo "apksigner failed with that key password:"
            tail -3 "$RUNNER_TEMP/apksigner.err" || true
          done
          if [ "$apk_ok" = true ]; then
            echo "--- certificate of the published APK ---"
            "$build_tools/apksigner" verify --print-certs android-output/app-debug.apk || true
          else
            echo "::warning::apksigner could not sign the APK with either password; the debug-signed APK is published instead."
            rm -f android-output/app-debug.apk
          fi

          aab_ok=false
          for candidate in "$ANDROID_KEY_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD"; do
            if sign_aab "$candidate"; then aab_ok=true; break; fi
            echo "jarsigner failed with that key password:"
            tail -3 "$RUNNER_TEMP/jarsigner.err" || true
          done
          if [ "$aab_ok" = true ]; then
            jarsigner -verify "android-output/PeriodicTableTrainer-${GITHUB_RUN_NUMBER}.aab" || true
          else
            echo "::warning::jarsigner could not sign the AAB with either password; an unsigned bundle is kept instead."
            rm -f "android-output/PeriodicTableTrainer-${GITHUB_RUN_NUMBER}.aab"
          fi
          rm -f "$keystore"

      # Guarantees a downloadable, installable APK and an AAB in every run.
      - name: Ensure APK and AAB are always published
        if: always()
        run: |
          mkdir -p android-output
          if [ ! -s android-output/app-debug.apk ]; then
            echo "::warning::no signed APK was produced; falling back to the debug-signed build."
            cp android/app/build/outputs/apk/debug/app-debug.apk android-output/app-debug.apk
          fi
          if [ ! -s "android-output/PeriodicTableTrainer-${GITHUB_RUN_NUMBER}.aab" ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab \
               "android-output/PeriodicTableTrainer-${GITHUB_RUN_NUMBER}.aab"
          fi
          ls -l android-output


      - name: Upload Android build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android-output/app-debug.apk
            android-output/PeriodicTableTrainer-${{ github.run_number }}.aab
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish build artifacts to GitHub Releases
    needs: [windows, build-android]
    # Publish whatever was built, even if one platform failed, so a single
    # platform problem can never block the other platform's release.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read application version
        id: app_version
        run: |
          version=$(grep -m1 '"version"' package.json | cut -d'"' -f4)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing v$version"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: List release assets
        run: ls -l release_assets

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}-build${{ github.run_number }}
          name: v${{ steps.app_version.outputs.version }} (Build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            نسخهٔ ${{ steps.app_version.outputs.version }} — ساخته‌شده از کامیت ${{ github.sha }}

            این نسخه بدون امضای کد (code signing) منتشر می‌شود.

            | فایل | توضیح |
            |---|---|
            | `PeriodicTableTrainer-windows.zip` | نصب‌کنندهٔ ویندوز + راهنما (بدون امضای Authenticode؛ ممکن است SmartScreen هشدار بدهد) |
            | `windows_index.html` | رابط ویندوز برای به‌روزرسانی درون‌برنامه‌ای |
            | `app-debug.apk` | APK اندروید برای نصب جانبی و به‌روزرسانی درون‌برنامه‌ای (با کلید پایدار مخزن امضا شده است) |
            | — | اگر کلید امضا در Secrets تنظیم نشده باشد، همان APK با کلید debug ساخته می‌شود و به‌روزرسانی درجا کار نمی‌کند |
            | `PeriodicTableTrainer-*.aab` | App Bundle امضاشده با همان کلید پایدار، برای بارگذاری دستی در Play Console |

            AAB در این workflow به Google Play ارسال نمی‌شود؛ انتشار در Play Console دستی است.
          files: release_assets/*
          fail_on_unmatched_files: false
