name: Build Windows EXE and Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip "pywebview[winforms]" pyinstaller

      - name: Build standalone EXE
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "PeriodicTableTrainer"
          --icon=app.ico
          --add-data "windows_index.html;."
          --collect-all webview --hidden-import=clr windows_app.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/PeriodicTableTrainer.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload replaceable Windows HTML
        uses: actions/upload-artifact@v4
        with:
          name: windows-html
          path: windows_index.html
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install Dependencies
        run: |
          npm ci
          cp mobile_index.html www/index.html
          npx cap add android
          python3 capacitor/scripts/prepare_android.py
          npx cap sync android

      - name: Select installed Android Build Tools
        id: android_tools
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$build_tools"
          echo "version=$build_tools" >> "$GITHUB_OUTPUT"

      - name: Build Android Release APK (Unsigned)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ steps.android_tools.outputs.version }}

      - name: Stage signed APK under the updater's stable filename
        run: |
          set -euo pipefail
          mkdir -p signed-output
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" signed-output/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: signed-output/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish build artifacts to GitHub Releases
    needs: [windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create a release for this push
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}-${{ github.run_attempt }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Automatically built from commit ${{ github.sha }}.
            Includes the Windows desktop executable, replaceable Windows HTML interface, and Android APK built with Capacitor and signed with the configured persistent release key.
          files: release_assets/*
          fail_on_unmatched_files: true
