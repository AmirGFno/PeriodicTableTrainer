name: Build Windows Installer, Android APK, and Play Bundle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip "pywebview[winforms]" pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows application (onedir, no Temp extraction)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name "PeriodicTableTrainer" `
            --icon=app.ico `
            --add-data "windows_index.html;." `
            --collect-all webview --hidden-import=clr windows_app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          # Keep a replaceable external HTML copy beside the EXE; AppData HTML
          # from the updater takes precedence on the next launch.
          Copy-Item "windows_index.html" "dist/PeriodicTableTrainer/windows_index.html" -Force

      - name: Detect optional Windows Authenticode certificate
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw "Set both Windows signing secrets or leave both empty."
          }
          if ($hasCertificate) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Warning "No Windows signing certificate configured; continuing with an unsigned EXE and installer. SmartScreen may show its warning."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Sign Windows application EXE (optional)
        if: ${{ steps.windows_signing.outputs.enabled == 'true' }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found" }
          $certificatePath = Join-Path $env:RUNNER_TEMP "PeriodicTableTrainer-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64.Trim()))
          try {
            $file = "dist/PeriodicTableTrainer/PeriodicTableTrainer.exe"
            & $signtool.FullName sign /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed: $file" }
            & $signtool.FullName verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signature verification failed: $file" }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Build Windows installer with Inno Setup
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force "dist/installer" | Out-Null
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $candidates = @((Join-Path $programFilesX86 'Inno Setup 6/ISCC.exe'), (Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe'))
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          & $iscc "/DMyAppVersion=$version" "installer/PeriodicTableTrainer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $setup = "dist/installer/PeriodicTableTrainer-Setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Setup executable was not created: $setup" }

      - name: Sign Windows installer (optional)
        if: ${{ steps.windows_signing.outputs.enabled == 'true' }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found" }
          $certificatePath = Join-Path $env:RUNNER_TEMP "PeriodicTableTrainer-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64.Trim()))
          try {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $file = "dist/installer/PeriodicTableTrainer-Setup-$version.exe"
            & $signtool.FullName sign /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed: $file" }
            & $signtool.FullName verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signature verification failed: $file" }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Package Windows installer ZIP
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "dist/installer/PeriodicTableTrainer-Setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Setup executable is missing: $setup" }
          New-Item -ItemType Directory -Force "dist/windows-package" | Out-Null
          Copy-Item $setup "dist/windows-package/"
          Copy-Item "installer/Readme.txt" "dist/windows-package/Readme.txt"
          Compress-Archive -Path "dist/windows-package/*" -DestinationPath "dist/PeriodicTableTrainer-windows.zip" -Force

      - name: Upload Windows installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-zip
          path: dist/PeriodicTableTrainer-windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload replaceable Windows HTML
        uses: actions/upload-artifact@v4
        with:
          name: windows-html
          path: windows_index.html
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android APK and AAB (Capacitor 8 / API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install Dependencies and icon tooling
        run: |
          npm ci
          python3 -m pip install --disable-pip-version-check "Pillow>=10,<13"
          cp mobile_index.html www/index.html
          npx cap add android
          python3 capacitor/scripts/prepare_android.py
          npx cap sync android

      - name: Select installed Android Build Tools
        id: android_tools
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$build_tools"
          echo "version=$build_tools" >> "$GITHUB_OUTPUT"

      - name: Build Android Release APK and Play Store App Bundle (Unsigned)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ steps.android_tools.outputs.version }}

      - name: Stage signed APK under the updater's stable filename
        run: |
          set -euo pipefail
          mkdir -p signed-output
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" signed-output/app-debug.apk

      - name: Sign Play Store App Bundle with the persistent release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/periodic-trainer-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unsigned="android/app/build/outputs/bundle/release/app-release.aab"
          signed="signed-output/PeriodicTableTrainer-${GITHUB_RUN_NUMBER}.aab"
          mkdir -p signed-output
          jarsigner -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" -signedjar "$signed" "$unsigned" "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$signed"
          rm -f "$keystore"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            signed-output/app-debug.apk
            signed-output/PeriodicTableTrainer-${{ github.run_number }}.aab
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish build artifacts to GitHub Releases
    needs: [windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create a release for this push
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}-${{ github.run_attempt }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Automatically built from commit ${{ github.sha }}.
            Includes the Authenticode-signed Windows installer ZIP and replaceable HTML interface, plus a signed Android APK for in-app updating and a signed Android App Bundle for Google Play Console, built with the persistent release key.
          files: release_assets/*
          fail_on_unmatched_files: true
